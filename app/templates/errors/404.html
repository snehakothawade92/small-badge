{% extends 'base.html' %}

{% block title %}Page Not Found - SmallBadge{% endblock %}

{% block content %}
<div class="container my-5 text-center">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card card-premium p-5 shadow">
                <div class="text-secondary mb-4">
                    <i class="fa-solid fa-compass fa-5x"></i>
                </div>
                <h1 class="fw-bold text-dark mb-2">404</h1>
                <h3 class="text-muted mb-4">Page Not Found</h3>
                <p class="text-muted leading-relaxed">
                    The URL you requested was not found or has been moved from the portal registry.
                </p>
                <hr class="my-4">
                <a href="{{ url_for('public.index') }}" class="btn btn-accent px-4 py-2">
                    <i class="fa-solid fa-home me-2"></i>Return to Homepage
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
